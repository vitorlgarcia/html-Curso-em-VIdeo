<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Areas Grid feitas nos items</title>

    <style>
    /* O grid-row-start, grid-row-end, grid-column-start e grid-column-end são comandos usados nas divs filhas para definir a área que cada item ocupará no grid. */
    /* Dessa forma, basta definir o inicio e fim de cada linha e coluna para ter um retângulo (área) definida sobre os pontos iniciais e finais delimitados. Os pontos finais e iniciais são escolhidos através das LINES do Grid. Verificar no arquivo PDF o que são as rows (faz parte das tracks do grid) e o que são as lines.  */

    /* Brincar com os valores de start e end para ver como o layout muda. Usar a visualização do grid disponibilizada pelo navegador Google Chrome ao apertar F12 e depois inspecionar as linhas HTML */
       

        .container {
            display: grid;
            grid-template-rows: repeat(3, 100px);
            grid-template-columns: repeat(4, 1fr);
        }

        .item1 {
           grid-row-start: 1;
           grid-row-end: 2;
           background-color: lightgreen;
           
           grid-column-start: 1;
           grid-column-end: 5;
           
           text-align: center;
           line-height: 100px;
        }

        .item2 {
           grid-row-start: 2;
           grid-row-end: 4;
           background-color: red;
           
           grid-column-start: 1;
           grid-column-end: 3; 
           
           text-align: center;
           line-height: 200px;
           color: white
        }

        .item3 {
              grid-row-start: 2;
              grid-row-end: 4;
              background-color: blue;
              
              grid-column-start: 3;
              grid-column-end: 5;

              text-align: center;
              line-height: 200px;
              color: white
        }


    </style>

</head>
<body>
    <div class="container">
        <div class="item1">Item 1</div>
        <div class="item2">Item 2</div>
        <div class="item3">Item 3</div>
</body>
</html>
