<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na Prática</title>

    <style>
        div.container {
            border: 3px solid blue;
            height: 250px;
            display: grid;
            grid-template-rows: repeat(3, 50px); /* Define as linhas do grid. Cada linha terá 50px de altura */
            
            grid-template-columns: repeat(3, 150px); /* Define as colunas do grid. Cada coluna terá 150px de largura */

            grid-auto-flow: column; /* Define a direção que os itens serão adicionados ao grid quando não houver mais espaço na linha ou coluna definida. Nesse exemplo, quando não houver mais espaço na linha, os itens serão adicionados em uma nova coluna. Por padrão é row. Usei nesse exemplo para movimentar o item J para uma nova coluna não definida no grid column. Tirar esse comando para ver o comportamente da DIV J em uma nova linha não definida no CSS. */

            grid-auto-rows: 50px; /* Define a altura das linhas que forem criadas automaticamente além das linhas definidas no grid-template-rows. Nesse exemplo foi criado a DIV J para exemplificar como o Grid não formata novas DIVS que NÃO estão definidas no grid-template-rows e grid-template-columns. Tirar o grid-auto-rows para ver como a DIV J fica sem a formatação igual as demais DIVs */

            grid-auto-columns: 150px; /* Define a largura das colunas que forem criadas automaticamente além das colunas definidas no grid-template-columns. Nesse exemplo foi criado a DIV J para exemplificar como o Grid não formata novas DIVS que NÃO estão definidas no grid-template-rows e grid-template-columns. Tirar o grid-auto-columns para ver como a DIV J fica sem a formatação igual as demais DIVs */

            gap: 10px;
            
        }

        div.item {
            border: 2px solid red;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
        <div class="item">I</div>
        <div class="item">J</div>

    </div>
</body>
</html>
